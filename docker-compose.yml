services:
  dream-league-finance-web:
    build:
      context: .
      target: production
    image: dream-league-finance-web
    container_name: dream-league-finance-web
    ports:
      - '3000:3000'
    environment:
      # Not 'production' locally: that flags cookies as Secure, which browsers drop over plain http.
      NODE_ENV: development
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
      MONGODB_URI: mongodb://dream-league-finance-mongo:27017/dream-league-finance
    depends_on:
      - dream-league-finance-mongo
    restart: unless-stopped

  dream-league-finance-mongo:
    image: mongo:7
    container_name: dream-league-finance-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
    external: true
    name: dream-league-finance-api_mongo_data
